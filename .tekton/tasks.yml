
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
  description: Remove existing files from the source workspace
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Cleaning source workspace..."
        rm -rf "${WORKSPACE_SOURCE_PATH:?}/"*
        rm -rf "${WORKSPACE_SOURCE_PATH:?}/".[!.]*
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
  description: Run Python unit tests using Nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.10
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing project dependencies..."
        pip install -r requirements.txt
        echo "Running unit tests with Nose..."
        nosetests -v tests
        echo "All unit tests passed successfully."
