
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
  description: Clean up temporary files and previous build artifacts
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-temporary-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Starting cleanup task..."
        find "$(workspaces.source.path)" -type d -name "__pycache__" -exec rm -rf {} +
        find "$(workspaces.source.path)" -type f -name "*.pyc" -delete
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
  description: Run Python unit tests using Nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.10
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing testing dependencies..."
        pip install flask flake8 nose==1.3.7
        echo "Running unit tests with Nose..."
        nosetests -v tests
        echo "All unit tests passed successfully."
